<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП — Управление меню</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
}
.wrap{
  max-width:1000px;
  margin:auto;
  padding:28px 22px 60px;
}
.logo{
  color:#ffc629;
  font-size:48px;
  font-weight:900;
}
h1{
  margin:8px 0 24px;
  color:#bbb;
  font-size:34px;
}
.password{
  width:100%;
  padding:18px;
  margin-bottom:26px;
  background:#191919;
  color:#fff;
  border:3px solid #444;
  border-radius:16px;
  font-size:22px;
}
.head,.row{
  display:grid;
  grid-template-columns:2fr .8fr 1.25fr .45fr;
  gap:10px;
  align-items:center;
}
.head{
  color:#aaa;
  font-size:17px;
  margin-bottom:10px;
}
.row{margin-bottom:10px}
.name,.price,.available{
  width:100%;
  min-width:0;
  padding:13px 10px;
  background:#191919;
  color:#fff;
  border:3px solid #444;
  border-radius:14px;
  font-size:18px;
}
.new{
  width:30px;
  height:30px;
}
button{
  width:100%;
  padding:22px 8px;
  margin-top:25px;
  border:0;
  border-radius:22px;
  background:#ffc629;
  color:#111;
  font-size:27px;
  font-weight:900;
}
button:disabled{opacity:.55}
#message{
  min-height:30px;
  margin-top:18px;
  text-align:center;
  font-size:19px;
}
.ok{color:#ffc629}
.error{color:#ff6961}

@media(max-width:600px){
  .wrap{padding:24px 16px 50px}
  .logo{font-size:42px}
  h1{font-size:28px}
  .head,.row{
    grid-template-columns:2fr .8fr 1.25fr .4fr;
    gap:7px;
  }
  .name,.price,.available{
    padding:11px 7px;
    font-size:16px;
  }
}
</style>
</head>

<body>
<div class="wrap">

  <div class="logo">ЦУП</div>
  <h1 id="title">Управление меню</h1>

  <input
    id="password"
    class="password"
    type="password"
    placeholder="Пароль администратора"
    autocomplete="current-password"
  >

  <div class="head">
    <div>Название</div>
    <div>Цена</div>
    <div>Статус</div>
    <div>NEW</div>
  </div>

  <div id="rows"></div>

  <button id="save" type="button">СОХРАНИТЬ МЕНЮ</button>

  <div id="message"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const store = params.get('store') || 'yurga-stroitelnaya';

const stores = {
  'leninsk':'Ленинск-Кузнецкий',
  'yurga-stroitelnaya':'Юрга — Строительная',
  'yurga-kirpichnaya':'Юрга — Кирпичная',
  'taiga':'Тайга',
  'yashkino':'Яшкино',
  'luna':'Луна'
};

const rows = document.getElementById('rows');
const message = document.getElementById('message');
const password = document.getElementById('password');
const saveButton = document.getElementById('save');

document.getElementById('title').textContent =
  'Управление: ' + (stores[store] || store);

function showMessage(text,type=''){
  message.textContent=text;
  message.className=type;
}

function blankItem(){
  return {
    name:'',
    price:0,
    available:true,
    new:false
  };
}

function escapeHTML(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function draw(items){
  rows.innerHTML='';

  const list=Array.isArray(items) ? [...items] : [];

  while(list.length<14){
    list.push(blankItem());
  }

  list.slice(0,14).forEach(item=>{
    const row=document.createElement('div');
    row.className='row';

    row.innerHTML=`
      <input
        class="name"
        type="text"
        value="${escapeHTML(item.name)}"
      >

      <input
        class="price"
        type="number"
        min="0"
        step="1"
        value="${Number(item.price)||0}"
      >

      <select class="available">
        <option value="true"
          ${item.available !== false ? 'selected' : ''}>
          В наличии
        </option>

        <option value="false"
          ${item.available === false ? 'selected' : ''}>
          Скрыть
        </option>
      </select>

      <input
        class="new"
        type="checkbox"
        ${item.new === true ? 'checked' : ''}
      >
    `;

    rows.appendChild(row);
  });
}

async function loadMenu(){
  showMessage('Загрузка меню…');

  try{
    const response=await fetch(
      '/api/menu?store='+
      encodeURIComponent(store)+
      '&t='+Date.now(),
      {cache:'no-store'}
    );

    const data=await response.json();

    if(!response.ok || data.ok === false){
      throw new Error(data.error || 'Ошибка загрузки');
    }

    draw(data.items || []);
    showMessage('');

  }catch(error){
    console.error(error);
    draw([]);
    showMessage(
      'Ошибка загрузки: '+error.message,
      'error'
    );
  }
}

function collectItems(){
  return [...document.querySelectorAll('.row')]
    .map(row=>({
      name:row.querySelector('.name').value.trim(),
      price:Number(row.querySelector('.price').value)||0,
      available:
        row.querySelector('.available').value==='true',
      new:row.querySelector('.new').checked
    }))
    .filter(item=>item.name!=='');
}

saveButton.addEventListener('click',async()=>{
  if(!password.value){
    showMessage(
      'Введите пароль администратора',
      'error'
    );
    password.focus();
    return;
  }

  saveButton.disabled=true;
  showMessage('Сохраняю…');

  try{
    const response=await fetch(
      '/api/menu?store='+encodeURIComponent(store),
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-admin-password':password.value
        },
        body:JSON.stringify({
          items:collectItems()
        })
      }
    );

    let data;

    try{
      data=await response.json();
    }catch{
      throw new Error(
        'Сервер вернул неправильный ответ'
      );
    }

    if(!response.ok || data.ok !== true){
      throw new Error(
        data.error || 'Ошибка сохранения'
      );
    }

    showMessage(
      '✓ МЕНЮ СОХРАНЕНО',
      'ok'
    );

  }catch(error){
    console.error(error);

    showMessage(
      'Ошибка: '+error.message,
      'error'
    );

  }finally{
    saveButton.disabled=false;
  }
});

loadMenu();
</script>

</body>
</html>
