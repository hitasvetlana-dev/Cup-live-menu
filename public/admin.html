<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЦУП — Админка</title><style>*{box-sizing:border-box}body{margin:auto;max-width:1000px;padding:22px;background:#080808;color:#fff;font-family:Arial,sans-serif}h1{color:#ffc629;margin-bottom:5px}h2{color:#aaa;margin-top:0}input,select{background:#181818;color:#fff;border:2px solid #444;border-radius:12px;padding:12px;font-size:17px;width:100%}#pw{margin:12px 0 20px}.head,.row{display:grid;grid-template-columns:2fr 100px 170px 60px;gap:8px;align-items:center;margin-bottom:9px}.head{color:#aaa}.new{width:30px;height:30px}button{width:100%;background:#ffc629;border:0;border-radius:16px;padding:18px;margin-top:16px;font-size:22px;font-weight:900}#msg{text-align:center;color:#ffc629;font-size:18px;margin:15px}@media(max-width:650px){body{padding:14px}.head,.row{grid-template-columns:2fr 75px 120px 45px;gap:5px}input,select{font-size:15px;padding:10px 6px}}</style></head><body><h1>ЦУП</h1><h2 id="title">Управление меню</h2><input id="pw" type="password" placeholder="Пароль администратора"><div class="head"><div>Название</div><div>Цена</div><div>Статус</div><div>NEW</div></div><div id="rows"></div><button onclick="save()">СОХРАНИТЬ МЕНЮ</button><div id="msg"></div><script>
const store=location.pathname.split('/').filter(Boolean)[1]||'leninsk';
function make(x={}){const r=document.createElement('div');r.className='row';r.innerHTML='<input class="n"><input class="p" type="number"><select class="s"><option value="sale">В наличии</option><option value="way">В пути</option><option value="hidden">Скрыть</option></select><input class="new" type="checkbox">';r.querySelector('.n').value=x.name||'';r.querySelector('.p').value=x.price||0;r.querySelector('.s').value=x.status||'sale';r.querySelector('.new').checked=!!x.new;return r}
async function load(){const r=await fetch('/api/menu/'+store+'?t='+Date.now(),{cache:'no-store'}),d=await r.json();document.getElementById('title').textContent='Управление: '+(d.store||store);const box=document.getElementById('rows');box.innerHTML='';const a=d.items||[];for(let i=0;i<Math.max(14,a.length);i++)box.appendChild(make(a[i]))}
async function save(){const items=[...document.querySelectorAll('.row')].map(r=>({name:r.querySelector('.n').value.trim(),price:Number(r.querySelector('.p').value)||0,status:r.querySelector('.s').value,new:r.querySelector('.new').checked})).filter(x=>x.name);const r=await fetch('/api/menu/'+store,{method:'PUT',headers:{'Content-Type':'application/json','x-admin-password':document.getElementById('pw').value},body:JSON.stringify({items})});const m=document.getElementById('msg');m.textContent=r.ok?'✓ Меню сохранено':((await r.json().catch(()=>({}))).error||'Ошибка')}</script><script>load()</script></body></html>
