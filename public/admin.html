<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЦУП — управление меню</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.wrap{
  max-width:800px;
  margin:auto;
  padding:24px 16px 60px;
}
h1{
  margin:0;
  font-size:32px;
}
.yellow{color:#ffc629}
.sub{
  color:#aaa;
  margin:8px 0 25px;
}
.password{
  width:100%;
  padding:15px;
  border-radius:10px;
  border:1px solid #444;
  background:#181818;
  color:white;
  font-size:18px;
  margin-bottom:20px;
}
.item{
  display:grid;
  grid-template-columns:1fr 110px 60px;
  gap:10px;
  margin-bottom:12px;
}
.item input[type="text"],
.item input[type="number"]{
  width:100%;
  padding:14px;
  background:#181818;
  border:1px solid #444;
  border-radius:8px;
  color:#fff;
  font-size:17px;
}
.check{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#181818;
  border-radius:8px;
}
.check input{
  width:24px;
  height:24px;
}
button{
  width:100%;
  padding:17px;
  margin-top:18px;
  background:#ffc629;
  color:#111;
  border:0;
  border-radius:10px;
  font-size:19px;
  font-weight:bold;
}
#status{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}
.labels{
  display:grid;
  grid-template-columns:1fr 110px 60px;
  gap:10px;
  color:#aaa;
  font-size:13px;
  margin-bottom:7px;
}
</style>
</head>

<body>
<div class="wrap">

<h1><span class="yellow">♛</span> ЦУП</h1>
<div class="sub">Управление экраном «Пиво на кранах»</div>

<input
  id="password"
  class="password"
  type="password"
  placeholder="Пароль администратора"
>

<div class="labels">
  <div>Название</div>
  <div>Цена ₽</div>
  <div>Показ</div>
</div>

<div id="items">Загрузка меню...</div>

<button onclick="saveMenu()">СОХРАНИТЬ МЕНЮ</button>

<div id="status"></div>

</div>

<script>
let menuData = null;

async function loadMenu(){
  const status=document.getElementById('status');

  try{
    const response=await fetch('/api/menu?time='+Date.now());

    if(!response.ok){
      throw new Error('Не удалось загрузить меню');
    }

    menuData=await response.json();

    const box=document.getElementById('items');
    box.innerHTML='';

    menuData.items.forEach((item,index)=>{
      const row=document.createElement('div');
      row.className='item';

      row.innerHTML=`
        <input
          type="text"
          value="${escapeHtml(item.name || '')}"
          oninput="menuData.items[${index}].name=this.value"
        >

        <input
          type="number"
          value="${Number(item.price) || 0}"
          oninput="menuData.items[${index}].price=Number(this.value)"
        >

        <label class="check">
          <input
            type="checkbox"
            ${item.show !== false ? 'checked' : ''}
            onchange="menuData.items[${index}].show=this.checked"
          >
        </label>
      `;

      box.appendChild(row);
    });

  }catch(error){
    document.getElementById('items').innerHTML='Ошибка загрузки';
    status.textContent=error.message;
  }
}

async function saveMenu(){
  const password=document.getElementById('password').value;
  const status=document.getElementById('status');

  if(!password){
    status.textContent='Введите пароль администратора';
    return;
  }

  status.textContent='Сохраняю...';

  try{
    const response=await fetch('/api/menu/default',{
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'x-admin-password':password
      },
      body:JSON.stringify({
        items:menuData.items
      })
    });

    if(response.status===401){
      throw new Error('Неверный пароль');
    }

    if(!response.ok){
      throw new Error('Ошибка сохранения');
    }

    status.textContent='✓ Меню сохранено';

  }catch(error){
    status.textContent=error.message;
  }
}

function escapeHtml(text){
  return String(text)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

loadMenu();
</script>

</body>
</html>
