<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>ЦУП — управление меню</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: #0b0b0b;

  color: #ffffff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body {
  min-height: 100vh;
}

/* =========================================
   ШАПКА
   ========================================= */

.header {
  position: sticky;
  top: 0;
  z-index: 1000;

  background: #0b0b0b;

  border-bottom:
    3px solid
    #ffc629;

  padding:
    16px 14px 14px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;
}

.logo {
  font-size: 25px;

  font-weight: 900;

  letter-spacing: 0.5px;
}

.logo span {
  color: #ffc629;
}

.subtitle {
  margin-top: 4px;

  color: #a9a9a9;

  font-size: 12px;

  font-weight: 700;
}

/* =========================================
   ОСНОВНОЙ КОНТЕЙНЕР
   ========================================= */

.container {
  width: 100%;

  max-width: 1100px;

  margin: 0 auto;

  padding:
    16px 12px 120px;
}

/* =========================================
   БЛОК НАСТРОЕК
   ========================================= */

.panel {
  background: #171717;

  border:
    1px solid
    #323232;

  border-radius:
    14px;

  padding:
    14px;

  margin-bottom:
    16px;
}

.panel-title {
  margin-bottom:
    12px;

  font-size:
    18px;

  font-weight:
    900;
}

.field {
  margin-bottom:
    12px;
}

.field:last-child {
  margin-bottom: 0;
}

label {
  display: block;

  margin-bottom:
    6px;

  color: #d5d5d5;

  font-size:
    13px;

  font-weight:
    800;
}

select,
input[type="text"],
input[type="number"],
input[type="password"] {
  width: 100%;

  min-height: 48px;

  padding:
    11px 12px;

  border:
    2px solid
    #363636;

  border-radius:
    10px;

  outline: none;

  background: #080808;

  color: #ffffff;

  font-size:
    17px;

  font-weight:
    700;
}

select:focus,
input:focus {
  border-color:
    #ffc629;
}

/* =========================================
   СТАТУС
   ========================================= */

.status {
  display: none;

  margin-top:
    12px;

  padding:
    12px;

  border-radius:
    10px;

  font-size:
    14px;

  font-weight:
    800;
}

.status.ok {
  display: block;

  background:
    rgba(42, 160, 80, 0.18);

  border:
    1px solid
    #2aa050;

  color:
    #8cffad;
}

.status.error {
  display: block;

  background:
    rgba(185, 45, 45, 0.18);

  border:
    1px solid
    #b92d2d;

  color:
    #ffaaaa;
}

.status.info {
  display: block;

  background:
    rgba(255, 198, 41, 0.12);

  border:
    1px solid
    #ffc629;

  color:
    #ffc629;
}

/* =========================================
   ЭКРАН ТВ
   ========================================= */

.tv-section {
  margin-top:
    22px;
}

.tv-title {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap:
    10px;

  margin-bottom:
    10px;

  padding:
    10px 12px;

  background:
    #ffc629;

  color:
    #000;

  border-radius:
    10px;

  font-size:
    17px;

  font-weight:
    900;
}

.tv-range {
  font-size:
    13px;

  font-weight:
    800;
}

/* =========================================
   КАРТОЧКА ПИВА
   ========================================= */

.beer-card {
  position: relative;

  margin-bottom:
    10px;

  padding:
    12px;

  background:
    #171717;

  border:
    1px solid
    #333333;

  border-radius:
    12px;
}

.beer-card.hidden-item {
  opacity: 0.55;
}

.card-number {
  display: inline-flex;

  align-items: center;

  justify-content: center;

  width: 32px;
  height: 32px;

  margin-bottom:
    10px;

  border-radius:
    50%;

  background:
    #ffc629;

  color:
    #000;

  font-size:
    14px;

  font-weight:
    900;
}

/* =========================================
   СЕТКА ПОЛЕЙ
   ========================================= */

.row-main {
  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    110px
    100px;

  gap:
    8px;
}

.small-label {
  margin-top:
    3px;

  color:
    #888;

  font-size:
    11px;

  font-weight:
    700;
}

/* =========================================
   ПЕРЕКЛЮЧАТЕЛИ
   ========================================= */

.switches {
  display: flex;

  flex-wrap: wrap;

  gap:
    8px;

  margin-top:
    11px;
}

.switch-box {
  display:
    inline-flex;

  align-items:
    center;

  gap:
    7px;

  min-height:
    40px;

  padding:
    7px 10px;

  background:
    #0c0c0c;

  border:
    1px solid
    #383838;

  border-radius:
    9px;

  color:
    #ffffff;

  font-size:
    13px;

  font-weight:
    800;

  cursor:
    pointer;
}

.switch-box input {
  width:
    20px;

  height:
    20px;

  accent-color:
    #ffc629;
}

.switch-new {
  color:
    #ffc629;
}

.switch-soon {
  color:
    #ffc629;
}

/* =========================================
   НИЖНЯЯ ПАНЕЛЬ
   ========================================= */

.save-bar {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 2000;

  padding:
    12px;

  background:
    rgba(
      11,
      11,
      11,
      0.96
    );

  border-top:
    2px solid
    #ffc629;
}

.save-inner {
  width: 100%;

  max-width:
    1100px;

  margin:
    0 auto;

  display:
    flex;

  gap:
    10px;
}

button {
  min-height:
    52px;

  padding:
    10px 16px;

  border:
    none;

  border-radius:
    11px;

  font-size:
    16px;

  font-weight:
    900;

  cursor:
    pointer;
}

.btn-save {
  flex: 1;

  background:
    #ffc629;

  color:
    #000;
}

.btn-save:disabled {
  opacity:
    0.5;
}

.btn-reload {
  width:
    60px;

  background:
    #292929;

  color:
    #fff;
}

/* =========================================
   ЗАГРУЗКА
   ========================================= */

.loading {
  padding:
    30px 10px;

  text-align:
    center;

  color:
    #ffc629;

  font-size:
    18px;

  font-weight:
    900;
}

/* =========================================
   МОБИЛЬНЫЙ
   ========================================= */

@media (
  max-width: 700px
) {

  .logo {
    font-size:
      22px;
  }

  .container {
    padding-left:
      8px;

    padding-right:
      8px;
  }

  .row-main {
    grid-template-columns:
      minmax(0, 1fr)
      88px;
  }

  .abv-field {
    grid-column:
      1 / -1;
  }

  .beer-card {
    padding:
      10px;
  }

  select,
  input[type="text"],
  input[type="number"],
  input[type="password"] {
    font-size:
      16px;
  }

}

</style>

</head>

<body>

<!-- ======================================
     ШАПКА
     ====================================== -->

<div class="header">

  <div class="header-top">

    <div>

      <div class="logo">
        ЦУП <span>LIVE MENU</span>
      </div>

      <div class="subtitle">
        Управление пивным меню
      </div>

    </div>

  </div>

</div>


<!-- ======================================
     КОНТЕНТ
     ====================================== -->

<div class="container">

  <div class="panel">

    <div class="panel-title">
      Управление меню
    </div>

    <div class="field">

      <label for="storeSelect">
        Точка
      </label>

      <select id="storeSelect">
      </select>

    </div>

    <div class="field">

      <label for="password">
        Пароль администратора
      </label>

      <input
        id="password"
        type="password"
        placeholder="Введите пароль"
        autocomplete="current-password"
      >

    </div>

    <div
      id="status"
      class="status"
    >
    </div>

  </div>


  <div id="menuArea">

    <div class="loading">
      Загружаю меню...
    </div>

  </div>

</div>


<!-- ======================================
     КНОПКИ
     ====================================== -->

<div class="save-bar">

  <div class="save-inner">

    <button
      id="reloadButton"
      class="btn-reload"
      type="button"
      title="Обновить"
    >
      ↻
    </button>

    <button
      id="saveButton"
      class="btn-save"
      type="button"
    >
      СОХРАНИТЬ МЕНЮ
    </button>

  </div>

</div>


<script>

/* =========================================
   ПЕРЕМЕННЫЕ
   ========================================= */

const storeSelect =
  document.getElementById(
    'storeSelect'
  );

const passwordInput =
  document.getElementById(
    'password'
  );

const menuArea =
  document.getElementById(
    'menuArea'
  );

const statusBox =
  document.getElementById(
    'status'
  );

const saveButton =
  document.getElementById(
    'saveButton'
  );

const reloadButton =
  document.getElementById(
    'reloadButton'
  );

let currentItems = [];

let currentLimit = 18;


/* =========================================
   СТАТУС
   ========================================= */

function showStatus(
  text,
  type
) {

  statusBox.className =
    'status ' +
    (type || 'info');

  statusBox.textContent =
    text;
}

function hideStatus() {

  statusBox.className =
    'status';

  statusBox.textContent =
    '';
}


/* =========================================
   БЕЗОПАСНЫЙ HTML
   ========================================= */

function escapeHtml(value) {

  return String(
    value == null
      ? ''
      : value
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );
}


/* =========================================
   ЗАГРУЗКА СПИСКА ТОЧЕК
   ========================================= */

async function loadStores() {

  try {

    const response =
      await fetch(
        '/api/stores',
        {
          cache:
            'no-store'
        }
      );

    if (!response.ok) {
      throw new Error(
        'Ошибка загрузки точек'
      );
    }

    const stores =
      await response.json();

    storeSelect.innerHTML =
      '';

    Object.keys(
      stores
    ).forEach(
      function (key) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          key;

        option.textContent =
          stores[key];

        storeSelect.appendChild(
          option
        );
      }
    );

    const savedStore =
      localStorage.getItem(
        'cup-admin-store'
      );

    if (
      savedStore &&
      stores[savedStore]
    ) {

      storeSelect.value =
        savedStore;

    } else if (
      stores[
        'yurga-stroitelnaya'
      ]
    ) {

      storeSelect.value =
        'yurga-stroitelnaya';
    }

    await loadMenu();

  } catch (error) {

    showStatus(
      'Не удалось загрузить список точек.',
      'error'
    );
  }
}


/* =========================================
   ЗАГРУЗКА МЕНЮ
   ========================================= */

async function loadMenu() {

  hideStatus();

  const store =
    storeSelect.value;

  if (!store) {
    return;
  }

  localStorage.setItem(
    'cup-admin-store',
    store
  );

  menuArea.innerHTML =
    '<div class="loading">Загружаю меню...</div>';

  try {

    const response =
      await fetch(
        '/api/menu?store=' +
        encodeURIComponent(
          store
        ) +
        '&t=' +
        Date.now(),
        {
          cache:
            'no-store'
        }
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        'Ошибка загрузки меню'
      );
    }

    currentLimit =
      Number(
        data.limit
      ) || 18;

    currentItems =
      Array.isArray(
        data.items
      )
        ? data.items
        : [];

    while (
      currentItems.length <
      currentLimit
    ) {

      currentItems.push({
        name: '',
        price: 0,
        abv: '',
        available: true,
        new: false,
        soon: false
      });
    }

    renderMenu();

  } catch (error) {

    menuArea.innerHTML =
      '';

    showStatus(
      error.message ||
      'Ошибка загрузки меню.',
      'error'
    );
  }
}


/* =========================================
   ОДНА КАРТОЧКА
   ========================================= */

function createCard(
  item,
  index
) {

  const card =
    document.createElement(
      'div'
    );

  card.className =
    'beer-card' +
    (
      item.available === false
        ? ' hidden-item'
        : ''
    );

  card.dataset.index =
    index;

  const number =
    index + 1;

  card.innerHTML =
`
<div class="card-number">
  ${number}
</div>

<div class="row-main">

  <div>

    <label>
      Название пива
    </label>

    <input
      type="text"
      class="beer-name-input"
      value="${escapeHtml(
        item.name || ''
      )}"
      placeholder="Например: Жигулевское"
    >

  </div>


  <div>

    <label>
      Цена
    </label>

    <input
      type="number"
      class="beer-price-input"
      value="${
        item.price || ''
      }"
      min="0"
      inputmode="decimal"
      placeholder="200"
    >

  </div>


  <div class="abv-field">

    <label>
      Алкоголь %
    </label>

    <input
      type="text"
      class="beer-abv-input"
      value="${escapeHtml(
        item.abv || ''
      )}"
      inputmode="decimal"
      placeholder="4.5"
    >

  </div>

</div>


<div class="switches">

  <label class="switch-box">

    <input
      type="checkbox"
      class="beer-available-input"
      ${
        item.available !== false
          ? 'checked'
          : ''
      }
    >

    Показывать

  </label>


  <label class="switch-box switch-new">

    <input
      type="checkbox"
      class="beer-new-input"
      ${
        item.new === true
          ? 'checked'
          : ''
      }
    >

    NEW

  </label>


  <label class="switch-box switch-soon">

    <input
      type="checkbox"
      class="beer-soon-input"
      ${
        item.soon === true
          ? 'checked'
          : ''
      }
    >

    Скоро подвезут

  </label>

</div>
`;

  const availableInput =
    card.querySelector(
      '.beer-available-input'
    );

  availableInput.addEventListener(
    'change',
    function () {

      if (
        availableInput.checked
      ) {

        card.classList.remove(
          'hidden-item'
        );

      } else {

        card.classList.add(
          'hidden-item'
        );
      }
    }
  );

  return card;
}


/* =========================================
   ОТРИСОВКА ВСЕГО МЕНЮ
   ========================================= */

function renderMenu() {

  menuArea.innerHTML =
    '';

  const itemsPerScreen =
    18;

  const screenCount =
    Math.ceil(
      currentLimit /
      itemsPerScreen
    );

  for (
    let screen = 0;
    screen < screenCount;
    screen++
  ) {

    const section =
      document.createElement(
        'div'
      );

    section.className =
      'tv-section';

    const start =
      screen *
      itemsPerScreen;

    const end =
      Math.min(
        start +
        itemsPerScreen,
        currentLimit
      );

    const title =
      document.createElement(
        'div'
      );

    title.className =
      'tv-title';

    title.innerHTML =
`
<span>
  ТВ ${screen + 1}
</span>

<span class="tv-range">
  позиции ${start + 1}–${end}
</span>
`;

    section.appendChild(
      title
    );

    for (
      let i = start;
      i < end;
      i++
    ) {

      const item =
        currentItems[i] || {
          name: '',
          price: 0,
          abv: '',
          available: true,
          new: false,
          soon: false
        };

      section.appendChild(
        createCard(
          item,
          i
        )
      );
    }

    menuArea.appendChild(
      section
    );
  }
}


/* =========================================
   СОБРАТЬ ДАННЫЕ ИЗ ФОРМЫ
   ========================================= */

function collectItems() {

  const cards =
    menuArea.querySelectorAll(
      '.beer-card'
    );

  const result =
    [];

  cards.forEach(
    function (card) {

      const name =
        card
          .querySelector(
            '.beer-name-input'
          )
          .value
          .trim();

      const priceValue =
        card
          .querySelector(
            '.beer-price-input'
          )
          .value;

      const abv =
        card
          .querySelector(
            '.beer-abv-input'
          )
          .value
          .replace(
            '%',
            ''
          )
          .trim();

      const available =
        card
          .querySelector(
            '.beer-available-input'
          )
          .checked;

      const isNew =
        card
          .querySelector(
            '.beer-new-input'
          )
          .checked;

      const soon =
        card
          .querySelector(
            '.beer-soon-input'
          )
          .checked;

      result.push({
        name:
          name,

        price:
          Number(
            priceValue
          ) || 0,

        abv:
          abv,

        available:
          available,

        new:
          isNew,

        soon:
          soon
      });
    }
  );

  return result;
}


/* =========================================
   СОХРАНЕНИЕ
   ========================================= */

async function saveMenu() {

  hideStatus();

  const store =
    storeSelect.value;

  const password =
    passwordInput.value;

  if (!password) {

    showStatus(
      'Введите пароль администратора.',
      'error'
    );

    passwordInput.focus();

    return;
  }

  const items =
    collectItems();

  saveButton.disabled =
    true;

  saveButton.textContent =
    'СОХРАНЯЮ...';

  try {

    const response =
      await fetch(
        '/api/menu?store=' +
        encodeURIComponent(
          store
        ),
        {
          method:
            'POST',

          headers: {
            'Content-Type':
              'application/json',

            'x-admin-password':
              password
          },

          body:
            JSON.stringify({
              items:
                items
            })
        }
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        'Ошибка сохранения'
      );
    }

    showStatus(
      '✓ Меню сохранено. Телевизоры обновятся автоматически.',
      'ok'
    );

    currentItems =
      data.items;

  } catch (error) {

    showStatus(
      error.message ||
      'Не удалось сохранить меню.',
      'error'
    );

  } finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      'СОХРАНИТЬ МЕНЮ';
  }
}


/* =========================================
   СОБЫТИЯ
   ========================================= */

storeSelect.addEventListener(
  'change',
  loadMenu
);

saveButton.addEventListener(
  'click',
  saveMenu
);

reloadButton.addEventListener(
  'click',
  loadMenu
);


/* =========================================
   ЗАПУСК
   ========================================= */

loadStores();

</script>

</body>

</html>
