<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ЦУП — Управление меню</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:28px 20px 70px;
}

.logo{
  color:#ffc629;
  font-size:54px;
  font-weight:900;
  margin-bottom:5px;
}

h1{
  margin:0 0 25px;
  font-size:30px;
}

.password{
  width:100%;
  padding:18px;
  font-size:20px;
  color:#fff;
  background:#181818;
  border:3px solid #444;
  border-radius:15px;
  margin-bottom:25px;
}

.screen-title{
  margin-top:30px;
  margin-bottom:12px;
  padding:12px 15px;
  background:#ffc629;
  color:#000;
  font-size:20px;
  font-weight:900;
  border-radius:10px;
}

.header-row,
.menu-row{
  display:grid;
  grid-template-columns:
    42px
    minmax(180px,1fr)
    120px
    170px
    70px;

  gap:10px;
  align-items:center;
}

.header-row{
  color:#aaa;
  font-size:15px;
  margin-bottom:8px;
  padding:0 5px;
}

.menu-row{
  margin-bottom:10px;
}

.number{
  color:#ffc629;
  font-weight:900;
  text-align:center;
}

input[type="text"],
input[type="number"],
select{
  width:100%;
  min-height:54px;
  background:#181818;
  border:2px solid #444;
  border-radius:12px;
  color:#fff;
  font-size:18px;
  padding:10px 12px;
}

input[type="number"]{
  text-align:center;
}

.new-box{
  display:flex;
  justify-content:center;
}

input[type="checkbox"]{
  width:30px;
  height:30px;
  accent-color:#ffc629;
}

.save{
  width:100%;
  margin-top:35px;
  min-height:80px;
  border:0;
  border-radius:20px;
  background:#ffc629;
  color:#050505;
  font-size:28px;
  font-weight:900;
  cursor:pointer;
}

.save:disabled{
  opacity:.55;
}

.message{
  text-align:center;
  min-height:35px;
  margin-top:18px;
  color:#ffc629;
  font-size:20px;
  font-weight:700;
}

.help{
  margin-top:25px;
  padding:18px;
  background:#111;
  border-radius:14px;
  color:#bbb;
  line-height:1.5;
}

.help strong{
  color:#ffc629;
}

@media(max-width:700px){

  .wrap{
    padding:22px 12px 60px;
  }

  .logo{
    font-size:45px;
  }

  h1{
    font-size:24px;
  }

  .header-row,
  .menu-row{
    grid-template-columns:
      30px
      minmax(120px,1fr)
      70px
      115px
      48px;

    gap:6px;
  }

  input[type="text"],
  input[type="number"],
  select{
    font-size:15px;
    padding:8px;
    min-height:48px;
  }

  .header-row{
    font-size:12px;
  }

  input[type="checkbox"]{
    width:27px;
    height:27px;
  }

  .save{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="logo">ЦУП</div>

  <h1 id="title">
    Управление меню
  </h1>

  <input
    id="password"
    class="password"
    type="password"
    placeholder="Пароль администратора"
    autocomplete="current-password"
  >

  <div id="rows"></div>

  <button
    id="saveButton"
    class="save"
    type="button"
  >
    СОХРАНИТЬ МЕНЮ
  </button>

  <div
    id="message"
    class="message"
  ></div>

  <div class="help">
    <strong>Три телевизора:</strong><br>
    Экран №1 — позиции 1–14<br>
    Экран №2 — позиции 15–28<br>
    Экран №3 — позиции 29–42
  </div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const store =
  params.get("store") ||
  "yurga-stroitelnaya";

const TOTAL_ITEMS = 42;
const ITEMS_PER_SCREEN = 14;


const rowsElement =
  document.getElementById("rows");

const titleElement =
  document.getElementById("title");

const passwordElement =
  document.getElementById("password");

const saveButton =
  document.getElementById("saveButton");

const messageElement =
  document.getElementById("message");


function blankItem(){

  return {
    name:"",
    price:0,
    available:true,
    new:false
  };

}


function createRows(items){

  rowsElement.innerHTML = "";

  for(
    let screen = 1;
    screen <= 3;
    screen++
  ){

    const title =
      document.createElement("div");

    title.className =
      "screen-title";

    const start =
      (screen - 1) *
      ITEMS_PER_SCREEN + 1;

    const end =
      screen *
      ITEMS_PER_SCREEN;

    title.textContent =
      "ТЕЛЕВИЗОР №" +
      screen +
      " — позиции " +
      start +
      "–" +
      end;

    rowsElement.appendChild(title);


    const header =
      document.createElement("div");

    header.className =
      "header-row";

    header.innerHTML =
      "<div>№</div>" +
      "<div>Название</div>" +
      "<div>Цена</div>" +
      "<div>Статус</div>" +
      "<div>NEW</div>";

    rowsElement.appendChild(header);


    for(
      let i = start - 1;
      i < end;
      i++
    ){

      const item =
        items[i] ||
        blankItem();

      const row =
        document.createElement("div");

      row.className =
        "menu-row";

      row.dataset.index = i;


      const number =
        document.createElement("div");

      number.className =
        "number";

      number.textContent =
        i + 1;


      const name =
        document.createElement("input");

      name.type =
        "text";

      name.className =
        "item-name";

      name.placeholder =
        "Название пива";

      name.value =
        item.name || "";


      const price =
        document.createElement("input");

      price.type =
        "number";

      price.className =
        "item-price";

      price.min =
        "0";

      price.step =
        "1";

      price.value =
        Number(item.price) || 0;


      const available =
        document.createElement("select");

      available.className =
        "item-available";

      const yes =
        document.createElement("option");

      yes.value =
        "true";

      yes.textContent =
        "В наличии";


      const no =
        document.createElement("option");

      no.value =
        "false";

      no.textContent =
        "Скрыть";


      available.appendChild(yes);
      available.appendChild(no);

      available.value =
        item.available === false
          ? "false"
          : "true";


      const newBox =
        document.createElement("div");

      newBox.className =
        "new-box";


      const isNew =
        document.createElement("input");

      isNew.type =
        "checkbox";

      isNew.className =
        "item-new";

      isNew.checked =
        item.new === true;


      newBox.appendChild(isNew);


      row.appendChild(number);
      row.appendChild(name);
      row.appendChild(price);
      row.appendChild(available);
      row.appendChild(newBox);


      rowsElement.appendChild(row);
    }
  }
}


function collectItems(){

  const rows =
    document.querySelectorAll(
      ".menu-row"
    );

  const items = [];


  rows.forEach(row => {

    const name =
      row.querySelector(
        ".item-name"
      ).value.trim();


    const price =
      Number(
        row.querySelector(
          ".item-price"
        ).value
      ) || 0;


    const available =
      row.querySelector(
        ".item-available"
      ).value === "true";


    const isNew =
      row.querySelector(
        ".item-new"
      ).checked;


    items.push({
      name,
      price,
      available,
      new:isNew
    });

  });


  return items;
}


async function loadMenu(){

  messageElement.textContent =
    "Загрузка меню...";


  try{

    const response =
      await fetch(
        "/api/menu?store=" +
        encodeURIComponent(store) +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      let errorText =
        "Ошибка загрузки";

      try{

        const errorData =
          await response.json();

        errorText =
          errorData.error ||
          errorText;

      }catch(e){}


      throw new Error(
        errorText
      );
    }


    const data =
      await response.json();


    titleElement.textContent =
      "Управление: " +
      (
        data.storeName ||
        store
      );


    let items =
      Array.isArray(data.items)
        ? data.items
        : [];


    while(
      items.length <
      TOTAL_ITEMS
    ){

      items.push(
        blankItem()
      );

    }


    items =
      items.slice(
        0,
        TOTAL_ITEMS
      );


    createRows(items);


    messageElement.textContent =
      "";

  }
  catch(error){

    console.error(error);

    createRows([]);

    messageElement.textContent =
      "Не удалось загрузить меню: " +
      error.message;
  }
}


async function saveMenu(){

  const password =
    passwordElement.value;


  if(!password){

    messageElement.textContent =
      "Введите пароль администратора";

    passwordElement.focus();

    return;
  }


  const items =
    collectItems();


  saveButton.disabled =
    true;

  saveButton.textContent =
    "СОХРАНЯЕМ...";

  messageElement.textContent =
    "Сохранение...";


  try{

    const response =
      await fetch(
        "/api/menu?store=" +
        encodeURIComponent(store),
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-admin-password":
              password
          },

          body:JSON.stringify({
            items
          })
        }
      );


    let data = {};

    try{

      data =
        await response.json();

    }catch(e){}


    if(!response.ok){

      throw new Error(
        data.error ||
        (
          "Ошибка сервера " +
          response.status
        )
      );
    }


    messageElement.textContent =
      "✓ МЕНЮ СОХРАНЕНО";


    setTimeout(
      () => {

        if(
          messageElement.textContent ===
          "✓ МЕНЮ СОХРАНЕНО"
        ){

          messageElement.textContent =
            "";
        }

      },
      5000
    );

  }
  catch(error){

    console.error(error);

    messageElement.textContent =
      "Ошибка сохранения: " +
      error.message;

  }
  finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "СОХРАНИТЬ МЕНЮ";
  }
}


saveButton.addEventListener(
  "click",
  saveMenu
);


loadMenu();

</script>

</body>
</html>
