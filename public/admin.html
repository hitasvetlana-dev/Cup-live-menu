<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЦУП — Управление меню</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
}
.wrap{
  max-width:1000px;
  margin:auto;
  padding:30px 26px 60px;
}
.logo{
  color:#ffc629;
  font-size:48px;
  font-weight:900;
  margin-bottom:10px;
}
h1{
  color:#aaa;
  font-size:36px;
  margin:0 0 30px;
}
.password{
  width:100%;
  padding:18px;
  font-size:24px;
  color:#fff;
  background:#181818;
  border:3px solid #444;
  border-radius:18px;
  margin-bottom:30px;
}
.head,.row{
  display:grid;
  grid-template-columns:2fr 1fr 1.5fr .5fr;
  gap:12px;
  align-items:center;
}
.head{
  color:#aaa;
  font-size:20px;
  margin-bottom:10px;
}
.row{margin-bottom:12px}
input,select{
  width:100%;
  background:#181818;
  color:#fff;
  border:3px solid #444;
  border-radius:14px;
  padding:14px;
  font-size:20px;
}
.check{
  width:32px;
  height:32px;
}
button{
  width:100%;
  margin-top:25px;
  padding:22px;
  border:0;
  border-radius:22px;
  background:#ffc629;
  color:#168cff;
  font-size:30px;
  font-weight:900;
}
#msg{
  text-align:center;
  margin-top:18px;
  font-size:20px;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="logo">ЦУП</div>
  <h1 id="title">Управление меню</h1>

  <input id="password" class="password"
         type="password"
         placeholder="Пароль администратора">

  <div class="head">
    <div>Название</div>
    <div>Цена</div>
    <div>Статус</div>
    <div>NEW</div>
  </div>

  <div id="rows"></div>

  <button onclick="saveMenu()">СОХРАНИТЬ МЕНЮ</button>
  <div id="msg"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const store = params.get('store') || 'leninsk';

const names = {
  'leninsk':'Ленинск-Кузнецкий',
  'yurga-stroitelnaya':'Юрга — Строительная',
  'yurga-kirpichnaya':'Юрга — Кирпичная',
  'taiga':'Тайга',
  'yashkino':'Яшкино',
  'luna':'Луна'
};

document.getElementById('title').textContent =
  'Управление: ' + (names[store] || store);

let menu=[];

async function loadMenu(){
  const msg=document.getElementById('msg');
  try{
    const r=await fetch('/api/menu/'+encodeURIComponent(store),{
      cache:'no-store'
    });

    if(!r.ok) throw new Error();

    menu=await r.json();

    if(!Array.isArray(menu)){
      if(Array.isArray(menu.items)) menu=menu.items;
      else menu=[];
    }

    while(menu.length<14){
      menu.push({
        name:'',
        price:0,
        available:true,
        isNew:false
      });
    }

    render();
    msg.textContent='';
  }catch(e){
    msg.textContent='Не удалось загрузить меню';
  }
}

function render(){
  const box=document.getElementById('rows');
  box.innerHTML='';

  menu.forEach((item,i)=>{
    const row=document.createElement('div');
    row.className='row';

    row.innerHTML=`
      <input class="name" value="${escapeHtml(item.name || '')}">
      <input class="price" type="number" value="${Number(item.price)||0}">
      <select class="available">
        <option value="true" ${item.available!==false?'selected':''}>В наличии</option>
        <option value="false" ${item.available===false?'selected':''}>Скрыть</option>
      </select>
      <input class="check new" type="checkbox" ${item.isNew?'checked':''}>
    `;

    box.appendChild(row);
  });
}

function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

async function saveMenu(){
  const rows=[...document.querySelectorAll('.row')];

  const items=rows.map(row=>({
    name:row.querySelector('.name').value.trim(),
    price:Number(row.querySelector('.price').value)||0,
    available:row.querySelector('.available').value==='true',
    isNew:row.querySelector('.new').checked
  }));

  const password=document.getElementById('password').value;
  const msg=document.getElementById('msg');

  msg.textContent='Сохраняю...';

  try{
    const r=await fetch('/api/menu/'+encodeURIComponent(store),{
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'x-admin-password':password
      },
      body:JSON.stringify(items)
    });

    if(!r.ok){
      if(r.status===401 || r.status===403){
        msg.textContent='Неверный пароль';
      }else{
        msg.textContent='Ошибка сохранения';
      }
      return;
    }

    msg.textContent='✓ Меню сохранено';
    menu=items;
  }catch(e){
    msg.textContent='Ошибка соединения';
  }
}

loadMenu();
</script>
</body>
</html>
