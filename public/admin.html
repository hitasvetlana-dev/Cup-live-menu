<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЦУП — управление меню</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.wrap{
  max-width:900px;
  margin:auto;
  padding:24px 16px 60px;
}
.logo{
  font-size:42px;
  font-weight:900;
}
.logo span{color:#ffc629}
h1{
  font-size:22px;
  color:#aaa;
  font-weight:400;
  margin:8px 0 28px;
}
.password{
  width:100%;
  background:#171717;
  border:2px solid #444;
  color:white;
  border-radius:14px;
  padding:18px;
  font-size:20px;
  margin-bottom:25px;
}
.head,.row{
  display:grid;
  grid-template-columns:2fr .7fr 1.2fr .65fr;
  gap:10px;
  align-items:center;
}
.head{
  color:#999;
  font-size:14px;
  padding:0 4px 8px;
}
.row{margin-bottom:12px}
input,select{
  width:100%;
  background:#171717;
  border:2px solid #3b3b3b;
  color:#fff;
  border-radius:12px;
  padding:14px;
  font-size:18px;
}
select{
  padding:14px 8px;
}
.newbox{
  display:flex;
  justify-content:center;
  align-items:center;
  background:#171717;
  border-radius:12px;
  height:54px;
}
.newbox input{
  width:26px;
  height:26px;
  accent-color:#ffc629;
}
button{
  width:100%;
  border:0;
  border-radius:14px;
  background:#ffc629;
  color:#0b0b0b;
  padding:18px;
  font-size:21px;
  font-weight:900;
  margin-top:18px;
}
.msg{
  text-align:center;
  margin-top:15px;
  min-height:24px;
  font-size:16px;
}
.legend{
  color:#999;
  font-size:13px;
  margin-top:20px;
  line-height:1.6;
}
@media(max-width:600px){
  .head,.row{
    grid-template-columns:1.7fr .65fr 1.15fr .55fr;
    gap:6px;
  }
  input,select{font-size:16px;padding:12px 8px}
  .logo{font-size:36px}
}
</style>
</head>

<body>
<div class="wrap">

<div class="logo"><span>♛</span> ЦУП</div>
<h1>Управление экраном «Пиво на кранах»</h1>

<input
  id="password"
  class="password"
  type="password"
  placeholder="Пароль администратора"
>

<div class="head">
  <div>Название</div>
  <div>Цена ₽</div>
  <div>Статус</div>
  <div>NEW</div>
</div>

<div id="rows">Загрузка меню...</div>

<button onclick="saveMenu()">СОХРАНИТЬ МЕНЮ</button>

<div id="msg" class="msg"></div>

<div class="legend">
В наличии — показывается в основном меню.<br>
В пути — показывается отдельно как «СКОРО НА КРАНАХ».<br>
Скрыть — полностью убирается с экрана.<br>
NEW — возле позиции появится отметка «НОВИНКА».
</div>

</div>

<script>
let items=[];

async function loadMenu(){
  try{
    const r=await fetch('/api/menu?ts='+Date.now());
    const data=await r.json();

    items=(data.items||[]).map(x=>({
      name:x.name||'',
      price:Number(x.price)||0,
      status:x.status || (x.show===false?'hidden':'available'),
      isNew:Boolean(x.isNew)
    }));

    render();
  }catch(e){
    document.getElementById('rows').innerHTML='Ошибка загрузки меню';
  }
}

function render(){
  const box=document.getElementById('rows');
  box.innerHTML='';

  items.forEach((x,i)=>{
    const row=document.createElement('div');
    row.className='row';

    row.innerHTML=`
      <input class="name" value="${esc(x.name)}">
      <input class="price" type="number" min="0" value="${x.price}">
      <select class="status">
        <option value="available" ${x.status==='available'?'selected':''}>В наличии</option>
        <option value="coming" ${x.status==='coming'?'selected':''}>В пути</option>
        <option value="hidden" ${x.status==='hidden'?'selected':''}>Скрыть</option>
      </select>
      <label class="newbox">
        <input class="new" type="checkbox" ${x.isNew?'checked':''}>
      </label>
    `;

    box.appendChild(row);
  });
}

function esc(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('"','&quot;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');
}

async function saveMenu(){
  const password=document.getElementById('password').value.trim();
  const rows=[...document.querySelectorAll('.row')];

  if(!password){
    showMsg('Введите пароль администратора',false);
    return;
  }

  const updated=rows.map(row=>({
    name:row.querySelector('.name').value.trim(),
    price:Number(row.querySelector('.price').value)||0,
    status:row.querySelector('.status').value,
    isNew:row.querySelector('.new').checked
  }));

  try{
    const r=await fetch('/api/menu',{
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'x-admin-password':password
      },
      body:JSON.stringify({items:updated})
    });

    if(!r.ok){
      if(r.status===401) throw new Error('Неверный пароль');
      throw new Error('Ошибка сохранения');
    }

    items=updated;
    showMsg('✓ Меню сохранено',true);
  }catch(e){
    showMsg(e.message,false);
  }
}

function showMsg(text,ok){
  const m=document.getElementById('msg');
  m.textContent=text;
  m.style.color=ok?'#ffc629':'#ff6666';
}

loadMenu();
</script>
</body>
</html>
