<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЦУП — Пиво на кранах</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030303;
  font-family:Arial,sans-serif;
  color:white;
}

.screen{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:#030303;
}

/* НОВАЯ ЧИСТАЯ КАРТИНКА */
.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  opacity:.62;
}

/* затемняем фон справа под меню */
.shade{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.15) 0%,
      rgba(0,0,0,.35) 35%,
      rgba(0,0,0,.82) 58%,
      rgba(0,0,0,.94) 100%);
}

/* меню занимает правую часть */
.panel{
  position:absolute;
  top:0;
  right:0;
  width:61%;
  height:100%;
  padding:6vh 5vw 4vh 3vw;
}

.header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  border-bottom:4px solid #ffc629;
  padding-bottom:2vh;
  margin-bottom:2.5vh;
}

.logo{
  font-size:3.2vw;
  font-weight:900;
  letter-spacing:.04em;
}

.logo span{
  color:#ffc629;
}

.heading{
  text-align:right;
}

.heading h1{
  margin:0;
  color:#ffc629;
  font-size:2vw;
  font-weight:900;
}

.heading p{
  margin:.5vh 0 0;
  font-size:.72vw;
  letter-spacing:.38em;
}

.heading small{
  display:block;
  margin-top:.8vh;
  font-size:.7vw;
  font-weight:700;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:3vw;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:8vh;
  border-bottom:1px solid rgba(255,255,255,.25);
  gap:1vw;
}

.name{
  font-size:1.45vw;
  font-weight:800;
  line-height:1.1;
}

.price{
  color:#ffc629;
  font-size:1.7vw;
  font-weight:900;
  white-space:nowrap;
}

.empty{
  display:none;
}
</style>
</head>

<body>

<div class="screen">

  <img
    class="bg"
    src="03BFD300-F622-4B6D-B466-26D615008FCD.png"
    alt=""
  >

  <div class="shade"></div>

  <main class="panel">

    <div class="header">
      <div class="logo">
        <span>♛</span> ЦУП
      </div>

      <div class="heading">
        <h1>ПИВО НА КРАНАХ</h1>
        <p>БАР ДЛЯ СВОИХ</p>
        <small>Ленинск-Кузнецкий</small>
      </div>
    </div>

    <div class="menu" id="menu"></div>

  </main>
</div>

<script>
const fallback = [
  {name:"Пиво 1",price:150},
  {name:"Пиво 2",price:160},
  {name:"Пиво 3",price:170},
  {name:"Пиво 4",price:180},
  {name:"Пиво 5",price:190},
  {name:"Пиво 6",price:200},
  {name:"Пиво 7",price:210},
  {name:"Пиво 8",price:220},
  {name:"Пиво 9",price:230},
  {name:"Пиво 10",price:240}
];

function draw(items){
  const menu=document.getElementById("menu");
  menu.innerHTML="";

  items
    .filter(x => x.show !== false && x.visible !== false)
    .slice(0,14)
    .forEach(x=>{
      const row=document.createElement("div");
      row.className="item";

      const name=document.createElement("div");
      name.className="name";
      name.textContent=x.name || x.title || "";

      const price=document.createElement("div");
      price.className="price";

      let value=x.price ?? "";
      price.textContent=value === "" ? "" : value + " ₽";

      row.appendChild(name);
      row.appendChild(price);
      menu.appendChild(row);
    });
}

async function loadMenu(){
  try{
    const r=await fetch("/api/menu?ts="+Date.now(),{
      cache:"no-store"
    });

    if(!r.ok) throw new Error();

    const data=await r.json();

    const items=Array.isArray(data)
      ? data
      : (data.items || data.menu || []);

    draw(items.length ? items : fallback);

  }catch(e){
    draw(fallback);
  }
}

loadMenu();
setInterval(loadMenu,15000);
</script>

</body>
</html>
