<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЦУП — Пиво на кранах</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 background:#050505;
 color:#fff;
 font-family:Arial,sans-serif;
 overflow:hidden;
}

.screen{
 width:100vw;
 height:100vh;
 position:relative;
 background:#050505 url('/beer-bg.png') center center/cover no-repeat;
}

/* затемнение фона, чтобы меню читалось */
.screen:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(90deg,
   rgba(0,0,0,.10) 0%,
   rgba(0,0,0,.25) 40%,
   rgba(0,0,0,.78) 58%,
   rgba(0,0,0,.94) 100%);
 pointer-events:none;
}

.menu{
 position:absolute;
 z-index:2;
 top:7vh;
 right:5vw;
 width:55vw;
 height:86vh;
}

.head{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 border-bottom:3px solid #ffc629;
 padding-bottom:2vh;
 margin-bottom:2vh;
}

.logo{
 font-size:4vw;
 font-weight:900;
 letter-spacing:.05em;
}

.logo span{color:#ffc629}

.heading{
 text-align:right;
}

.heading h1{
 margin:0;
 color:#ffc629;
 font-size:2.1vw;
}

.heading .tag{
 margin-top:.6vh;
 font-size:.85vw;
 letter-spacing:.32em;
 color:#bbb;
}

.heading .store{
 margin-top:1vh;
 font-size:.9vw;
 font-weight:bold;
 letter-spacing:.08em;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:0 3vw;
}

.item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 min-height:7.5vh;
 border-bottom:1px solid #444;
 font-size:1.65vw;
 font-weight:700;
}

.price{
 color:#ffc629;
 font-size:2vw;
 font-weight:900;
 white-space:nowrap;
}

.soon-title{
 grid-column:1/-1;
 color:#ffc629;
 font-size:1.05vw;
 letter-spacing:.2em;
 font-weight:900;
 margin-top:1.5vh;
}

.soon{
 opacity:.58;
}

.new{
 color:#ffc629;
 font-size:.7vw;
 margin-left:.6vw;
 letter-spacing:.1em;
}
</style>
</head>

<body>
<div class="screen">

 <main class="menu">
   <div class="head">
     <div class="logo"><span>♛</span> ЦУП</div>

     <div class="heading">
       <h1>ПИВО НА КРАНАХ</h1>
       <div class="tag">БАР ДЛЯ СВОИХ</div>
       <div class="store" id="store"></div>
     </div>
   </div>

   <div class="grid" id="beer"></div>
 </main>

</div>

<script>
const params=new URLSearchParams(location.search);
const store=params.get('store') || 'leninsk';

async function load(){
 try{
   const r=await fetch('/api/menu/'+store+'?t='+Date.now());
   const data=await r.json();

   document.getElementById('store').textContent=
     data.store || '';

   const box=document.getElementById('beer');
   box.innerHTML='';

   const available=(data.items||[]).filter(x=>
     x.status!=='hidden' &&
     x.status!=='hide' &&
     x.status!=='Скрыть' &&
     x.status!=='soon' &&
     x.status!=='В пути'
   );

   const soon=(data.items||[]).filter(x=>
     x.status==='soon' || x.status==='В пути'
   );

   available.forEach(x=>{
     box.insertAdjacentHTML('beforeend',`
       <div class="item">
         <div>${x.name||''}${x.new?'<span class="new">NEW</span>':''}</div>
         <div class="price">${x.price||''} ₽</div>
       </div>
     `);
   });

   if(soon.length){
     box.insertAdjacentHTML('beforeend',
       '<div class="soon-title">СКОРО НА КРАНАХ</div>'
     );

     soon.forEach(x=>{
       box.insertAdjacentHTML('beforeend',`
         <div class="item soon">
           <div>${x.name||''}${x.new?'<span class="new">NEW</span>':''}</div>
           <div class="price">${x.price||''} ₽</div>
         </div>
       `);
     });
   }
 }catch(e){
   console.error(e);
 }
}

load();
setInterval(load,15000);
</script>
</body>
</html>
