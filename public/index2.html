<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ЦУП — Пиво на кранах</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.screen{
  width:100vw;
  height:100vh;
  position:relative;
  background:#050505;
}

/* НОВЫЙ ФОН */
.bg{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(
      90deg,
      rgba(0,0,0,.12) 0%,
      rgba(0,0,0,.20) 30%,
      rgba(0,0,0,.55) 48%,
      rgba(0,0,0,.76) 100%
    ),
    url("03BFD300-F622-4B6D-B466-26D615008FCD.png");

  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
}

/* дополнительное затемнение справа под меню */
.shade{
  position:absolute;
  top:0;
  right:0;
  width:65%;
  height:100%;
  background:linear-gradient(
    90deg,
    rgba(0,0,0,.15),
    rgba(0,0,0,.72) 28%,
    rgba(0,0,0,.88) 100%
  );
}

/* МЕНЮ */
.menu{
  position:absolute;
  top:5vh;
  right:4vw;
  width:61vw;
  height:90vh;
  z-index:5;
}

.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  border-bottom:3px solid #ffc629;
  padding-bottom:2vh;
  margin-bottom:2vh;
}

.logo{
  font-size:4vw;
  font-weight:900;
  letter-spacing:.04em;
}

.logo span{
  color:#ffc629;
  font-size:2.2vw;
  margin-right:.7vw;
}

.title{
  text-align:right;
}

.title h1{
  margin:0;
  color:#ffc629;
  font-size:2.05vw;
  font-weight:900;
}

.tag{
  margin-top:.7vh;
  color:#aaa;
  font-size:.72vw;
  font-weight:700;
  letter-spacing:.28em;
}

.store{
  margin-top:.8vh;
  font-size:.8vw;
  font-weight:700;
  letter-spacing:.06em;
}

/* ДВЕ КОЛОНКИ */
.columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 3vw;
}

.item{
  min-height:7vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1vw;
  border-bottom:1px solid rgba(255,255,255,.20);
}

.name{
  font-size:1.65vw;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price{
  flex:none;
  color:#ffc629;
  font-size:2vw;
  font-weight:900;
  white-space:nowrap;
}

.soonTitle{
  grid-column:1/-1;
  color:#ffc629;
  font-size:1.05vw;
  font-weight:900;
  letter-spacing:.18em;
  margin-top:1.6vh;
  margin-bottom:.4vh;
}

.soon{
  opacity:.52;
}

/* маленькая подпись слева */
.leftText{
  position:absolute;
  left:3vw;
  top:7vh;
  z-index:4;
  color:#ffc629;
  font-size:1vw;
  font-weight:800;
  line-height:1.25;
  transform:rotate(-5deg);
}

@media(max-aspect-ratio:1/1){
  .menu{
    width:62vw;
    right:3vw;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="bg"></div>
  <div class="shade"></div>

  <div class="leftText">
    ХОРОШЕЕ<br>
    ПИВО<br>
    ЗДЕСЬ!
  </div>

  <main class="menu">

    <div class="header">

      <div class="logo">
        <span>♛</span>ЦУП
      </div>

      <div class="title">
        <h1>ПИВО НА КРАНАХ</h1>
        <div class="tag">БАР ДЛЯ СВОИХ</div>
        <div class="store" id="store"></div>
      </div>

    </div>

    <div class="columns" id="items"></div>

  </main>

</div>

<script>
const params = new URLSearchParams(location.search);

let store =
  params.get("store") ||
  location.pathname.split("/").filter(Boolean).pop() ||
  "leninsk";

const storeNames = {
  "leninsk":"Ленинск-Кузнецкий",
  "yurga-stroitelnaya":"Юрга — Строительная",
  "yurga-kirpichnaya":"Юрга — Кирпичная",
  "taiga":"Тайга",
  "yashkino":"Яшкино",
  "luna":"Луна"
};

document.getElementById("store").textContent =
  storeNames[store] || store;

async function loadMenu(){

  try{

    const response =
      await fetch("/api/menu/" + encodeURIComponent(store) + "?t=" + Date.now());

    if(!response.ok) throw new Error("Ошибка загрузки");

    const data = await response.json();

    const all = Array.isArray(data.items) ? data.items : [];

    const available = all.filter(x =>
      x.visible !== false &&
      x.status !== "soon"
    );

    const soon = all.filter(x =>
      x.visible !== false &&
      x.status === "soon"
    );

    const box = document.getElementById("items");
    box.innerHTML = "";

    available.forEach(x => {

      const row = document.createElement("div");
      row.className = "item";

      row.innerHTML =
        '<div class="name"></div>' +
        '<div class="price"></div>';

      row.querySelector(".name").textContent =
        x.name || "";

      row.querySelector(".price").textContent =
        (x.price ?? "") + " ₽";

      box.appendChild(row);

    });

    if(soon.length){

      const title = document.createElement("div");
      title.className = "soonTitle";
      title.textContent = "СКОРО НА КРАНАХ";
      box.appendChild(title);

      soon.forEach(x => {

        const row = document.createElement("div");
        row.className = "item soon";

        row.innerHTML =
          '<div class="name"></div>' +
          '<div class="price"></div>';

        row.querySelector(".name").textContent =
          x.name || "";

        row.querySelector(".price").textContent =
          (x.price ?? "") + " ₽";

        box.appendChild(row);

      });

    }

  }catch(e){

    document.getElementById("items").innerHTML =
      '<div style="font-size:1.4vw;color:#999">Меню загружается…</div>';

  }

}

loadMenu();

/* обновление экрана автоматически */
setInterval(loadMenu,15000);
</script>

</body>
</html>
