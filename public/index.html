<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>ЦУП — Пивное меню</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  font-family:Arial,sans-serif;
}

body{
  color:white;
}

/* ФОНОВОЕ ИЗОБРАЖЕНИЕ */

.background{
  position:fixed;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.90) 0%,
      rgba(0,0,0,.80) 48%,
      rgba(0,0,0,.35) 100%
    ),
    url("beer-bg.png");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  z-index:0;
}

/* ОСНОВНОЙ ЭКРАН */

.screen{
  position:relative;
  z-index:1;

  width:100vw;
  height:100vh;

  padding:
    clamp(25px,3vh,55px)
    clamp(40px,4vw,85px);

  display:flex;
  flex-direction:column;
}

/* ШАПКА */

.header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  border-bottom:
    clamp(2px,.25vw,5px)
    solid #ffc629;

  padding-bottom:
    clamp(12px,1.5vh,24px);

  margin-bottom:
    clamp(20px,2.5vh,40px);
}

.brand{
  display:flex;
  align-items:baseline;
  gap:25px;
}

.logo{
  color:#ffc629;

  font-size:
    clamp(58px,6vw,110px);

  line-height:.85;

  font-weight:900;
  letter-spacing:-4px;
}

.subtitle{
  color:#fff;

  font-size:
    clamp(22px,2vw,38px);

  font-weight:800;

  letter-spacing:2px;
}

.store{
  color:#aaa;

  font-size:
    clamp(18px,1.5vw,29px);

  font-weight:700;

  text-align:right;
}

/* МЕНЮ */

.menu{
  flex:1;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  column-gap:
    clamp(55px,6vw,130px);

  align-content:start;
}

.column{
  min-width:0;
}

/* СТРОКА ПИВА */

.beer{
  height:
    clamp(65px,8.2vh,100px);

  display:grid;

  grid-template-columns:
    minmax(0,1fr) auto;

  align-items:center;

  gap:25px;

  border-bottom:
    1px solid rgba(255,255,255,.13);
}

.name{
  min-width:0;

  color:#fff;

  font-size:
    clamp(30px,3vw,58px);

  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  text-shadow:
    0 3px 12px rgba(0,0,0,.9);
}

.price-wrap{
  display:flex;
  align-items:baseline;
  gap:7px;
}

.price{
  color:#ffc629;

  font-size:
    clamp(38px,3.7vw,70px);

  font-weight:900;

  white-space:nowrap;

  text-shadow:
    0 3px 14px rgba(0,0,0,.9);
}

.rub{
  color:#ffc629;

  font-size:
    clamp(19px,1.5vw,28px);

  font-weight:900;
}

/* NEW */

.new{
  display:inline-block;

  margin-left:12px;

  padding:
    4px 9px;

  border-radius:7px;

  background:#b92d2d;

  color:#fff;

  font-size:
    clamp(13px,1vw,18px);

  font-weight:900;

  vertical-align:middle;
}

/* ПУСТОЕ МЕНЮ */

.empty{
  grid-column:1 / -1;

  margin-top:100px;

  text-align:center;

  color:#777;

  font-size:
    clamp(30px,3vw,55px);

  font-weight:700;
}

/* НИЖНЯЯ СТРОКА */

.footer{
  margin-top:auto;

  padding-top:15px;

  color:#aaa;

  font-size:
    clamp(15px,1.15vw,22px);

  font-weight:700;

  letter-spacing:1px;
}

.footer span{
  color:#ffc629;
}

</style>
</head>

<body>

<div class="background"></div>

<div class="screen">

  <div class="header">

    <div class="brand">

      <div class="logo">
        ЦУП
      </div>

      <div class="subtitle">
        ПИВНОЙ БАР • МАРКЕТ
      </div>

    </div>

    <div
      class="store"
      id="storeName">
    </div>

  </div>


  <div
    class="menu"
    id="menu">
  </div>


  <div class="footer">
    <span>ЦУП</span> — БАР ДЛЯ СВОИХ
  </div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const store =
  params.get('store') ||
  'yurga-stroitelnaya';


const stores = {

  'leninsk':
    'Ленинск-Кузнецкий',

  'yurga-stroitelnaya':
    'Юрга • Строительная',

  'yurga-kirpichnaya':
    'Юрга • Кирпичная',

  'taiga':
    'Тайга',

  'yashkino':
    'Яшкино',

  'luna':
    'Луна'

};


document
  .getElementById('storeName')
  .textContent =
  stores[store] || store;


const menu =
  document.getElementById('menu');


function escapeHTML(value){

  return String(value ?? '')

    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function beerHTML(item){

  const newBadge =
    item.new
    ? '<span class="new">NEW</span>'
    : '';

  return `

    <div class="beer">

      <div class="name">

        ${escapeHTML(item.name)}

        ${newBadge}

      </div>

      <div class="price-wrap">

        <div class="price">
          ${Number(item.price) || 0}
        </div>

        <div class="rub">
          ₽
        </div>

      </div>

    </div>

  `;

}


function draw(items){

  const visible =
    items.filter(item =>
      item &&
      item.name &&
      item.available !== false
    );


  if(!visible.length){

    menu.innerHTML = `
      <div class="empty">
        Меню обновляется
      </div>
    `;

    return;
  }


  const left =
    visible.slice(0,7);

  const right =
    visible.slice(7,14);


  menu.innerHTML = `

    <div class="column">

      ${left
        .map(beerHTML)
        .join('')}

    </div>


    <div class="column">

      ${right
        .map(beerHTML)
        .join('')}

    </div>

  `;

}


async function loadMenu(){

  try{

    const response =
      await fetch(

        '/api/menu?store=' +

        encodeURIComponent(store) +

        '&t=' +

        Date.now(),

        {
          cache:'no-store'
        }

      );


    if(!response.ok){
      throw new Error(
        'HTTP ' + response.status
      );
    }


    const data =
      await response.json();


    if(
      data.storeName
    ){

      document
        .getElementById('storeName')
        .textContent =
        data.storeName;

    }


    draw(
      Array.isArray(data.items)
      ? data.items
      : []
    );


  }catch(error){

    console.error(
      'Ошибка загрузки меню:',
      error
    );

  }

}


/* первая загрузка */

loadMenu();


/*
Экран автоматически проверяет
изменения каждые 10 секунд.
Телевизор перезагружать не нужно.
*/

setInterval(
  loadMenu,
  10000
);

</script>

</body>
</html>
