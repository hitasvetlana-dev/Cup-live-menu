<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЦУП — Пиво на кранах</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.screen{width:100vw;height:100vh;padding:3vh 3vw;display:grid;grid-template-columns:36% 1fr;gap:2.5vw}.hero{height:100%;overflow:hidden;border-right:1px solid #332b15;background:#080808}.hero img{width:100%;height:100%;object-fit:contain;object-position:center}.content{height:100%;display:flex;flex-direction:column;min-width:0}.header{height:20%;display:flex;align-items:center;justify-content:space-between;border-bottom:.4vh solid #ffc629}.brand{display:flex;align-items:center;gap:1vw}.crown{color:#ffc629;font-size:3vw}.logo{font-size:5vw;font-weight:900}.heading{text-align:right;color:#ffc629;font-size:2.2vw;font-weight:900}.sub{display:block;color:#aaa;font-size:.43em;letter-spacing:.22em;margin-top:.45em}.store{color:#fff;font-size:.48em;letter-spacing:.08em;margin-top:.6em}.menu{flex:1;padding-top:2.5vh;display:grid;grid-template-columns:1fr 1fr;column-gap:3vw;align-content:start}.item{min-height:9vh;display:flex;align-items:center;gap:.8vw;border-bottom:1px solid #333}.name{flex:1;min-width:0;font-size:1.9vw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{color:#ffc629;font-size:2.25vw;font-weight:900;white-space:nowrap}.badge{margin-left:.35vw;padding:.25em .5em;border-radius:5px;background:#ffc629;color:#090909;font-size:.4em;font-weight:900}.soonTitle{grid-column:1/-1;color:#ffc629;font-size:1.3vw;font-weight:900;letter-spacing:.12em;margin:1.5vh 0 .3vh}.soon{opacity:.58}.empty{color:#777;font-size:1.5vw}</style></head>
<body><div class="screen"><section class="hero"><img src="/4E59B063-84B3-42EB-9977-CC0A8EAB2EC6.png"></section><main class="content"><header class="header"><div class="brand"><div class="crown">♛</div><div class="logo">ЦУП</div></div><div class="heading">ПИВО НА КРАНАХ<span class="sub">БАР ДЛЯ СВОИХ</span><div class="store" id="store"></div></div></header><div class="menu" id="menu"><div class="empty">Загрузка меню…</div></div></main></div>
<script>const store=location.pathname.split('/').filter(Boolean)[1]||'leninsk';async function loadMenu(){try{const r=await fetch('/api/menu/'+store+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();document.getElementById('store').textContent=d.store||'';const a=(d.items||[]).filter(x=>x.status==='sale'||!x.status),s=(d.items||[]).filter(x=>x.status==='way'),b=document.getElementById('menu');b.innerHTML='';function add(x,soon){const row=document.createElement('div');row.className='item'+(soon?' soon':'');const n=document.createElement('div');n.className='name';n.textContent=x.name||'';if(x.new){const q=document.createElement('span');q.className='badge';q.textContent='НОВИНКА';n.appendChild(q)}const p=document.createElement('div');p.className='price';p.textContent=(x.price??'')+' ₽';row.append(n,p);b.appendChild(row)}a.forEach(x=>add(x,false));if(s.length){const t=document.createElement('div');t.className='soonTitle';t.textContent='СКОРО НА КРАНАХ';b.appendChild(t);s.forEach(x=>add(x,true))}if(!a.length&&!s.length)b.innerHTML='<div class="empty">Меню обновляется</div>'}catch(e){document.getElementById('menu').innerHTML='<div class="empty">Обновление меню…</div>'}}loadMenu();setInterval(loadMenu,15000)</script></body></html>
