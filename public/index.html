<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЦУП — Пиво на кранах</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.screen{width:100vw;height:100vh;padding:3.5vh 4vw;display:grid;grid-template-columns:28% 1fr;gap:3vw}

/* ФИРМЕННАЯ КАРТИНКА */
.hero{position:relative;height:100%;overflow:hidden;border-right:1px solid #332b15;background:#080808}
.heroImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}

/* ПРАВАЯ ЧАСТЬ */
.content{height:100%;display:flex;flex-direction:column;min-width:0}
.header{height:20%;display:flex;align-items:center;justify-content:space-between;border-bottom:clamp(3px,.35vw,7px) solid #ffc629}
.brand{display:flex;align-items:center;gap:1.1vw}
.crown{color:#ffc629;font-size:clamp(30px,3vw,70px);line-height:1}
.logo{font-size:clamp(50px,5.2vw,110px);font-weight:900;letter-spacing:.04em}
.heading{color:#ffc629;text-align:right;font-size:clamp(24px,2.3vw,50px);font-weight:900}
.sub{display:block;color:#aaa;font-size:.43em;letter-spacing:.25em;margin-top:.45em}

/* МЕНЮ */
.menu{flex:1;padding-top:3vh;display:grid;grid-template-columns:1fr 1fr;column-gap:4vw;align-content:start}
.item{min-height:9.3vh;display:flex;align-items:center;gap:1vw;border-bottom:1px solid #333;position:relative}
.name{flex:1;min-width:0;font-size:clamp(25px,2.15vw,48px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:#ffc629;font-size:clamp(28px,2.45vw,54px);font-weight:900;white-space:nowrap}
.badge{display:inline-block;margin-left:.5vw;padding:.28em .55em;border-radius:6px;background:#ffc629;color:#090909;font-size:.43em;font-weight:900;vertical-align:middle}
.soonTitle{grid-column:1/-1;color:#ffc629;font-size:clamp(18px,1.45vw,32px);font-weight:900;letter-spacing:.12em;margin:2vh 0 .4vh}
.soon{opacity:.58}
.empty{color:#777;font-size:2vw}
</style>
</head>
<body>
<div class="screen">
  <section class="hero">
    <img class="heroImage" src="4E59B063-84B3-42EB-9977-CC0A8EAB2EC6.png" alt="ЦУП — бар для своих">
  </section>

  <main class="content">
    <header class="header">
      <div class="brand">
        <div class="crown">♛</div>
        <div class="logo">ЦУП</div>
      </div>
      <div class="heading">
        ПИВО НА КРАНАХ
        <span class="sub">БАР ДЛЯ СВОИХ</span>
      </div>
    </header>

    <div class="menu" id="menu">
      <div class="empty">Загрузка меню…</div>
    </div>
  </main>
</div>

<script>
async function loadMenu(){
  try{
    const r=await fetch('/api/menu?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error();
    const data=await r.json();
    const items=Array.isArray(data) ? data : (data.items || data.menu || []);

    const available=items.filter(x =>
      x.status !== 'hidden' &&
      x.status !== 'скрыть' &&
      x.status !== 'hide' &&
      x.status !== 'soon' &&
      x.status !== 'В пути' &&
      x.status !== 'в пути'
    );

    const soon=items.filter(x =>
      x.status === 'soon' ||
      x.status === 'В пути' ||
      x.status === 'в пути'
    );

    const box=document.getElementById('menu');
    box.innerHTML='';

    function addItem(x,soonClass=false){
      const row=document.createElement('div');
      row.className='item'+(soonClass?' soon':'');
      const name=document.createElement('div');
      name.className='name';
      name.textContent=x.name || x.title || '';

      const isNew=x.new === true || x.isNew === true || x.NEW === true;
      if(isNew){
        const badge=document.createElement('span');
        badge.className='badge';
        badge.textContent='НОВИНКА';
        name.appendChild(badge);
      }

      const price=document.createElement('div');
      price.className='price';
      price.textContent=(x.price ?? '')+' ₽';
      row.appendChild(name);
      row.appendChild(price);
      box.appendChild(row);
    }

    available.forEach(x=>addItem(x));

    if(soon.length){
      const title=document.createElement('div');
      title.className='soonTitle';
      title.textContent='СКОРО НА КРАНАХ';
      box.appendChild(title);
      soon.forEach(x=>addItem(x,true));
    }

    if(!available.length && !soon.length){
      box.innerHTML='<div class="empty">Меню обновляется</div>';
    }
  }catch(e){
    document.getElementById('menu').innerHTML='<div class="empty">Обновление меню…</div>';
  }
}
loadMenu();
setInterval(loadMenu,15000);
</script>
</body>
</html>
