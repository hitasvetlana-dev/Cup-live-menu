<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ЦУП — Пивное меню</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

body{
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.08) 0%,
      rgba(0,0,0,.18) 35%,
      rgba(0,0,0,.30) 65%,
      rgba(0,0,0,.12) 100%
    ),
    url("03BFD300-F622-4B6D-B466-26D615008FCD.png")
    center center / cover no-repeat;
}

.page{
  width:100vw;
  height:100vh;
  padding:4vh 4.5vw 3vh;
  display:flex;
  flex-direction:column;
}

/* ШАПКА */

.header{
  display:flex;
  align-items:center;
  border-bottom:3px solid #ffc629;
  padding-bottom:2.2vh;
  min-height:15vh;
}

.logo{
  font-size:7vw;
  line-height:.85;
  font-weight:900;
  color:#ffc629;
  letter-spacing:-.4vw;
  margin-right:3vw;
}

.subtitle{
  font-size:2.6vw;
  font-weight:800;
  letter-spacing:.25vw;
  white-space:nowrap;
}

.store{
  margin-left:auto;
  font-size:2vw;
  font-weight:700;
  color:#ddd;
  text-align:right;
  max-width:30vw;
}

/* МЕНЮ */

.menu{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:7vw;
  padding-top:4vh;
  min-height:0;
}

.column{
  display:flex;
  flex-direction:column;
}

.item{
  min-height:9vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:2vw;

  border-bottom:1px solid rgba(255,255,255,.12);
}

.name{
  font-size:2.8vw;
  line-height:1.05;
  font-weight:800;
  text-shadow:0 2px 5px #000;
  overflow:hidden;
}

.price{
  color:#ffc629;
  font-size:3.4vw;
  line-height:1;
  font-weight:900;
  white-space:nowrap;
  text-shadow:0 2px 5px #000;
}

.rub{
  font-size:1.4vw;
  margin-left:.25vw;
  color:#ffc629;
}

/* NEW */

.new-badge{
  display:inline-block;
  margin-left:.7vw;
  padding:.2vw .45vw;
  background:#ffc629;
  color:#000;
  border-radius:.3vw;
  font-size:.85vw;
  vertical-align:middle;
  font-weight:900;
}

/* НИЖНЯЯ СТРОКА */

.footer{
  height:5vh;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  color:#ffc629;
  font-weight:800;
  font-size:1.2vw;
  letter-spacing:.1vw;
}

/* ЕСЛИ МЕНЮ ПУСТО */

.empty{
  grid-column:1 / -1;
  display:flex;
  justify-content:center;
  align-items:center;
  height:50vh;
  color:#aaa;
  font-size:2.5vw;
  font-weight:700;
}

/* Для узких экранов */

@media (max-aspect-ratio: 4/3){
  .logo{
    font-size:9vw;
  }

  .subtitle{
    font-size:3vw;
  }

  .store{
    font-size:2.5vw;
  }

  .name{
    font-size:3.1vw;
  }

  .price{
    font-size:3.7vw;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="header">

    <div class="logo">
      ЦУП
    </div>

    <div class="subtitle">
      ПИВНОЙ БАР • МАРКЕТ
    </div>

    <div class="store" id="storeName">
      ЦУП
    </div>

  </div>

  <div class="menu" id="menu">
  </div>

  <div class="footer">
    ЦУП — БАР ДЛЯ СВОИХ
  </div>

</div>


<script>

const params = new URLSearchParams(window.location.search);

const store = params.get("store") || "yurga-stroitelnaya";

/*
  screen=1 → позиции 1–14
  screen=2 → позиции 15–28
  screen=3 → позиции 29–42
*/

let screen = parseInt(params.get("screen") || "1",10);

if(screen < 1) screen = 1;
if(screen > 3) screen = 3;

const ITEMS_PER_SCREEN = 14;

const menuElement =
  document.getElementById("menu");

const storeNameElement =
  document.getElementById("storeName");


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function render(items){

  menuElement.innerHTML = "";

  const availableItems =
    Array.isArray(items)
      ? items.filter(item =>
          item &&
          item.available !== false &&
          String(item.name || "").trim() !== ""
        )
      : [];

  /*
    ВАЖНО:
    позиции делятся по номеру экрана
  */

  const start =
    (screen - 1) * ITEMS_PER_SCREEN;

  const end =
    start + ITEMS_PER_SCREEN;

  const screenItems =
    availableItems.slice(start,end);


  if(screenItems.length === 0){

    menuElement.innerHTML =
      '<div class="empty">Меню обновляется</div>';

    return;
  }


  /*
    На каждом телевизоре:
    максимум 14 позиций.
    7 слева + 7 справа.
  */

  const leftItems =
    screenItems.slice(0,7);

  const rightItems =
    screenItems.slice(7,14);


  const leftColumn =
    document.createElement("div");

  leftColumn.className = "column";


  const rightColumn =
    document.createElement("div");

  rightColumn.className = "column";


  function createItem(item){

    const row =
      document.createElement("div");

    row.className = "item";


    const name =
      document.createElement("div");

    name.className = "name";


    let nameHtml =
      escapeHtml(item.name);


    if(item.new === true){

      nameHtml +=
        '<span class="new-badge">NEW</span>';
    }


    name.innerHTML =
      nameHtml;


    const price =
      document.createElement("div");

    price.className = "price";


    const numberPrice =
      Number(item.price) || 0;


    price.innerHTML =
      escapeHtml(numberPrice) +
      '<span class="rub">₽</span>';


    row.appendChild(name);
    row.appendChild(price);

    return row;
  }


  leftItems.forEach(item => {

    leftColumn.appendChild(
      createItem(item)
    );

  });


  rightItems.forEach(item => {

    rightColumn.appendChild(
      createItem(item)
    );

  });


  menuElement.appendChild(leftColumn);
  menuElement.appendChild(rightColumn);
}


async function loadMenu(){

  try{

    const response =
      await fetch(
        "/api/menu?store=" +
        encodeURIComponent(store) +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Ошибка сервера " +
        response.status
      );

    }


    const data =
      await response.json();


    storeNameElement.textContent =
      data.storeName || store;


    render(
      data.items || []
    );


  }catch(error){

    console.error(error);

    menuElement.innerHTML =
      '<div class="empty">Меню обновляется</div>';

  }

}


/*
  Загружаем сразу
*/

loadMenu();


/*
  Проверяем изменения каждые 10 секунд.
  Сотруднику не нужно обновлять телевизор.
*/

setInterval(
  loadMenu,
  10000
);

</script>

</body>
</html>
