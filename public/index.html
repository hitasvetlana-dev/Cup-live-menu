<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП — Пиво на кранах</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030303;
  font-family:Arial,sans-serif;
  color:white;
}

.screen{
  width:100vw;
  height:100vh;
  position:relative;
  background:#030303;
  display:flex;
}

/* КОСМОНАВТ */

.hero{
  width:40%;
  height:100%;
  position:relative;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:left center;
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,0) 45%,
      rgba(0,0,0,.35) 70%,
      #030303 100%
    );
}

/* МЕНЮ */

.menu{
  width:60%;
  height:100%;
  padding:6vh 5vw 4vh 2vw;
  position:relative;
  z-index:2;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:5px solid #ffc629;
  padding-bottom:2vh;
  margin-bottom:2vh;
}

.brand{
  font-size:4.2vw;
  font-weight:900;
  letter-spacing:.04em;
}

.brand span{
  color:#ffc629;
}

.heading{
  text-align:right;
}

.heading h1{
  margin:0;
  color:#ffc629;
  font-size:2.4vw;
  font-weight:900;
}

.heading p{
  margin:.5vh 0 0;
  font-size:.85vw;
  letter-spacing:.4em;
}

.city{
  font-size:.75vw;
  font-weight:700;
  margin-top:.7vh;
}

/* СПИСОК */

.beers{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:3vw;
}

.beer{
  height:8vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #444;
  gap:1vw;
}

.name{
  font-size:1.65vw;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price{
  color:#ffc629;
  font-size:2vw;
  font-weight:900;
  white-space:nowrap;
}

.empty{
  opacity:.6;
}

@media(max-width:900px){
  .brand{font-size:5vw;}
  .heading h1{font-size:3vw;}
  .name{font-size:2vw;}
  .price{font-size:2.4vw;}
}
</style>
</head>

<body>

<div class="screen">

  <section class="hero">
    <img src="03BFD300-F622-4B6D-B466-26D615008FCD.png" alt="ЦУП">
  </section>

  <main class="menu">

    <div class="top">

      <div class="brand">
        <span>♛</span> ЦУП
      </div>

      <div class="heading">
        <h1>ПИВО НА КРАНАХ</h1>
        <p>БАР ДЛЯ СВОИХ</p>
        <div class="city">Ленинск-Кузнецкий</div>
      </div>

    </div>

    <div class="beers" id="beers"></div>

  </main>

</div>

<script>

const demo = [
  {name:"Пиво 1",price:150},
  {name:"Пиво 2",price:160},
  {name:"Пиво 3",price:170},
  {name:"Пиво 4",price:180},
  {name:"Пиво 5",price:190},
  {name:"Пиво 6",price:200},
  {name:"Пиво 7",price:210},
  {name:"Пиво 8",price:220},
  {name:"Пиво 9",price:230},
  {name:"Пиво 10",price:240}
];

function draw(items){

  const box=document.getElementById("beers");
  box.innerHTML="";

  items
    .filter(x => x.show !== false)
    .slice(0,14)
    .forEach(item=>{

      const row=document.createElement("div");
      row.className="beer";

      const name=document.createElement("div");
      name.className="name";
      name.textContent=item.name || "";

      const price=document.createElement("div");
      price.className="price";
      price.textContent=(item.price || "")+" ₽";

      row.appendChild(name);
      row.appendChild(price);

      box.appendChild(row);
    });
}

async function load(){

  try{

    const response=await fetch("/api/menu?ts="+Date.now(),{
      cache:"no-store"
    });

    if(!response.ok) throw new Error();

    const data=await response.json();

    const items=Array.isArray(data)
      ? data
      : (data.items || data.beers || []);

    if(items.length){
      draw(items);
    }else{
      draw(demo);
    }

  }catch(e){
    draw(demo);
  }
}

load();

/* автоматически обновляем меню */
setInterval(load,15000);

</script>

</body>
</html>
